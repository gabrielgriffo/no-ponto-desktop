name: 'publish'

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:

  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            pkg-config \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]

    runs-on: ${{ matrix.platform }}

    steps:
      # ─────────────────────────────────────────────
      # Checkout
      # ─────────────────────────────────────────────

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # ─────────────────────────────────────────────
      # Get version from Git tag
      #
      # v1.2.3 → 1.2.3
      # ─────────────────────────────────────────────

      - name: Get version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$GITHUB_REF_NAME' não é uma tag vX.Y.Z. Dispare o workflow a partir de uma tag."
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Building version: $VERSION"

      # ─────────────────────────────────────────────
      # Setup Node
      # ─────────────────────────────────────────────

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm

      # ─────────────────────────────────────────────
      # Setup Rust
      # ─────────────────────────────────────────────

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      # ─────────────────────────────────────────────
      # Rust cache
      # ─────────────────────────────────────────────

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "./src-tauri -> target"

      # ─────────────────────────────────────────────
      # Linux system dependencies
      #
      # libwebkit2gtk/libgtk/librsvg: webview do Tauri
      # libappindicator3: ícone da bandeja (tray)
      # pkg-config: usado pelos crates *-sys (gtk/glib/webkit) pra localizar as libs acima
      # patchelf: empacotamento AppImage
      #
      # reqwest usa rustls (TLS embutido no binário), não precisa de libssl-dev
      # ─────────────────────────────────────────────

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            pkg-config \
            patchelf

      # ─────────────────────────────────────────────
      # Install frontend dependencies
      # ─────────────────────────────────────────────

      - name: Install dependencies
        run: npm ci

      # ─────────────────────────────────────────────
      # Synchronize version
      #
      # Git tag:
      #   v1.2.3
      #
      # Becomes:
      #   package.json       → 1.2.3
      #   Cargo.toml         → 1.2.3
      #   tauri.conf.json    → 1.2.3
      # ─────────────────────────────────────────────

      - name: Set application version
        shell: bash
        run: |
          node <<'EOF'
          const fs = require("fs");

          const version = process.env.VERSION;

          if (!version) {
            throw new Error("VERSION environment variable is missing");
          }

          console.log(`Setting application version to ${version}`);

          // ────────────────────────────────────────
          // package.json
          // ────────────────────────────────────────

          const packagePath = "package.json";
          const packageJson = JSON.parse(
            fs.readFileSync(packagePath, "utf8")
          );

          packageJson.version = version;

          fs.writeFileSync(
            packagePath,
            JSON.stringify(packageJson, null, 2) + "\n"
          );

          // ────────────────────────────────────────
          // package-lock.json
          // ────────────────────────────────────────

          if (fs.existsSync("package-lock.json")) {
            const lockPath = "package-lock.json";
            const lockJson = JSON.parse(
              fs.readFileSync(lockPath, "utf8")
            );

            lockJson.version = version;

            if (lockJson.packages && lockJson.packages[""]) {
              lockJson.packages[""].version = version;
            }

            fs.writeFileSync(
              lockPath,
              JSON.stringify(lockJson, null, 2) + "\n"
            );
          }

          // ────────────────────────────────────────
          // Cargo.toml
          // ────────────────────────────────────────

          const cargoPath = "src-tauri/Cargo.toml";
          let cargoToml = fs.readFileSync(cargoPath, "utf8");

          const packageSection = cargoToml.match(
            /\[package\]([\s\S]*?)(?=\n\[|$)/
          );

          if (!packageSection) {
            throw new Error(
              "Could not find [package] section in Cargo.toml"
            );
          }

          const updatedPackageSection =
            packageSection[0].replace(
              /^version\s*=\s*"[^"]+"/m,
              `version = "${version}"`
            );

          if (updatedPackageSection === packageSection[0]) {
            throw new Error(
              "Could not find version inside [package] in Cargo.toml"
            );
          }

          cargoToml = cargoToml.replace(
            packageSection[0],
            updatedPackageSection
          );

          fs.writeFileSync(cargoPath, cargoToml);

          // ────────────────────────────────────────
          // tauri.conf.json
          // ────────────────────────────────────────

          const tauriConfigPath = "src-tauri/tauri.conf.json";
          const tauriConfig = JSON.parse(
            fs.readFileSync(tauriConfigPath, "utf8")
          );

          tauriConfig.version = version;

          fs.writeFileSync(
            tauriConfigPath,
            JSON.stringify(tauriConfig, null, 2) + "\n"
          );

          console.log("Version synchronized successfully.");
          EOF

      # ─────────────────────────────────────────────
      # Verify versions
      # ─────────────────────────────────────────────

      - name: Verify versions
        shell: bash
        run: |
          echo "Expected version: $VERSION"

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VERSION=$(grep -A20 '^\[package\]' src-tauri/Cargo.toml | grep '^version' | head -1 | sed -E 's/.*"([^"]+)".*/\1/')

          echo "package.json:       $PACKAGE_VERSION"
          echo "Cargo.toml:         $CARGO_VERSION"
          echo "tauri.conf.json:    $TAURI_VERSION"

          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "package.json version mismatch!"
            exit 1
          fi

          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "Cargo.toml version mismatch!"
            exit 1
          fi

          if [ "$TAURI_VERSION" != "$VERSION" ]; then
            echo "tauri.conf.json version mismatch!"
            exit 1
          fi

          echo "All versions match."

      - name: Build
        shell: bash
        run: npx tauri build --ci

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p dist-bundles
          shopt -s nullglob
          for file in \
            src-tauri/target/release/bundle/nsis/*-setup.exe \
            src-tauri/target/release/bundle/msi/*.msi \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm; do
            cp "$file" "dist-bundles/$(basename "$file" | tr ' ' '.')"
          done
          ls -la dist-bundles

      - name: Upload bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundles-${{ matrix.platform }}
          path: dist-bundles/
          if-no-files-found: error

  publish-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*

      - name: Download bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bundles-*
          path: bundles
          merge-multiple: true

      - name: Sign bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for file in bundles/*; do
            npx --yes @tauri-apps/cli@2.9.6 signer sign               --private-key "$TAURI_SIGNING_PRIVATE_KEY"               --password="$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"               "$file"
          done
          ls -la bundles

      - name: Build latest.json
        shell: bash
        env:
          REPO: ${{ github.repository }}
        run: |
          node <<'EOF'
          const fs = require("fs");
          const path = require("path");

          const tag = process.env.GITHUB_REF_NAME;
          const version = tag.replace(/^v/, "");
          const base = `https://github.com/${process.env.REPO}/releases/download/${tag}`;
          const files = fs.readdirSync("bundles");

          const entry = (suffix) => {
            const file = files.find((name) => name.endsWith(suffix));
            if (!file) throw new Error(`Bundle não encontrado: *${suffix}`);
            return {
              signature: fs.readFileSync(path.join("bundles", `${file}.sig`), "utf8").trim(),
              url: `${base}/${encodeURIComponent(file)}`,
            };
          };

          const msi = entry(".msi");
          const appimage = entry(".AppImage");

          const latest = {
            version,
            notes: "",
            pub_date: new Date().toISOString(),
            platforms: {
              "windows-x86_64": msi,
              "windows-x86_64-msi": msi,
              "windows-x86_64-nsis": entry("-setup.exe"),
              "linux-x86_64": appimage,
              "linux-x86_64-appimage": appimage,
              "linux-x86_64-deb": entry(".deb"),
              "linux-x86_64-rpm": entry(".rpm"),
            },
          };

          fs.writeFileSync("bundles/latest.json", JSON.stringify(latest, null, 2) + "\n");
          console.log(JSON.stringify(Object.keys(latest.platforms)));
          EOF

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" bundles/* \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes ""

      - name: Build downloads table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release-downloads.sh "$GITHUB_REF_NAME"

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          current=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          newest=$(printf '%s\n%s\n' "${current#v}" "${GITHUB_REF_NAME#v}" | sort -V | tail -n 1)
          latest_flag=--latest
          if [ -n "$current" ] && [ "$newest" != "${GITHUB_REF_NAME#v}" ]; then
            latest_flag=--latest=false
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false "$latest_flag"
