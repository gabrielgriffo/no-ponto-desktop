@if (update(); as update) {
  <button
    type="button"
    class="update-button"
    [class.is-installing]="isInstalling()"
    [attr.aria-busy]="isInstalling()"
    (click)="onClick()"
    [appTooltip]="'Versão ' + update.version + ' pronta para instalar'"
    tooltipPosition="bottom"
    [tooltipDelay]="500"
    >
    Atualizar
    @if (isInstalling()) {
      <span class="spinner update-spinner"></span>
    }
  </button>
}
