@if (update) {
  <button
    type="button"
    class="update-button"
    [class.is-installing]="isInstalling"
    [attr.aria-busy]="isInstalling"
    (click)="onClick()"
    [appTooltip]="'Versão ' + update.version + ' disponível'"
    tooltipPosition="bottom"
    [tooltipDelay]="500"
    >
    Atualizar
    @if (isInstalling) {
      <span class="spinner update-spinner"></span>
    }
  </button>
}
