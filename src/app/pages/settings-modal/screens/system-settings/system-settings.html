<div class="settings-screen">
  <div class="setting-item">
    <div class="setting-header">
      <span class="setting-label">Iniciar com o Sistema</span>
      <app-toggle-switch
        [checked]="settings.autostartEnabled"
        (checkedChange)="settings.autostartEnabled = $event; onChange()"
      ></app-toggle-switch>
    </div>
    <span class="setting-description">
      Inicia junto com o sistema, já minimizado na bandeja
    </span>
  </div>
</div>
