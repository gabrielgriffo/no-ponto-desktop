<div class="settings-screen">
  <div class="setting-item">
    <div class="setting-content">
      <label class="input-label">Jornada de referência</label>
      <app-custom-select
        [options]="workdayOptions"
        [value]="selectedWorkday()"
        (valueChange)="onWorkdaySelect($event)" />
    </div>

    @if (selectedWorkday() === customDuration) {
      <div class="setting-content">
        <label class="input-label" for="workday-custom">Horas e minutos</label>
        <div class="field-control">
          <input
            id="workday-custom"
            class="field-input"
            type="text"
            inputmode="numeric"
            placeholder="--:--"
            maxlength="5"
            autocomplete="off"
            appTimeInput
            [value]="customWorkday()"
            (input)="onCustomWorkday($any($event.target).value)"
          />
        </div>
      </div>
    }

    <span class="setting-description">
      Define a base de cálculo do tempo restante e do fim do expediente
    </span>
  </div>

  <div class="setting-item">
    <div class="setting-content">
      <label class="input-label">Intervalo padrão</label>
      <app-custom-select
        [options]="breakOptions"
        [value]="selectedBreak()"
        (valueChange)="onBreakSelect($event)" />
    </div>

    @if (selectedBreak() === customDuration) {
      <div class="setting-content">
        <label class="input-label" for="break-custom">Horas e minutos</label>
        <div class="field-control">
          <input
            id="break-custom"
            class="field-input"
            type="text"
            inputmode="numeric"
            placeholder="--:--"
            maxlength="5"
            autocomplete="off"
            appTimeInput
            [value]="customBreak()"
            (input)="onCustomBreak($any($event.target).value)"
          />
        </div>
      </div>
    }

    <span class="setting-description">
      Estima o horário de saída até que o intervalo real seja registrado
    </span>
  </div>
</div>
