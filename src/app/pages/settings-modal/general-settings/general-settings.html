<div class="tab-content">
  <!-- Iniciar com o Sistema -->
  <div class="setting-item">
    <div class="setting-header">
      <span class="setting-label">Iniciar com o Sistema</span>
      <app-toggle-switch
        [checked]="settings.autostartEnabled"
        (checkedChange)="settings.autostartEnabled = $event; onToggleChange()"
      ></app-toggle-switch>
    </div>
  </div>

  <!-- Linha -->
  <div class="line"></div>

  <!-- Sincronização Inteligente -->
  <div class="setting-item">
    <div class="setting-header">
      <div class="setting-label-group">
        <span class="setting-label">Sincronização Inteligente</span>
        <span class="dev-badge">Em desenvolvimento</span>
      </div>
      <app-toggle-switch
        [checked]="settings.smartSyncEnabled"
        (checkedChange)="settings.smartSyncEnabled = $event; onToggleChange()"
      ></app-toggle-switch>
    </div>
  </div>

  <!-- Linha -->
  <div class="line"></div>

  <!-- Sincronização Automática -->
  <div class="setting-item">
    <div class="setting-header">
      <span class="setting-label">Sincronização Automática</span>
      <app-toggle-switch
        [checked]="settings.autoImportEnabled"
        (checkedChange)="settings.autoImportEnabled = $event; onToggleChange()"
      ></app-toggle-switch>
    </div>
  </div>

  <!-- Intervalo -->
  <div class="setting-item" *ngIf="settings.autoImportEnabled">
    <div class="setting-content">
      <label class="input-label">Intervalo da Sincronização Automática</label>
      <app-custom-select
        [options]="intervalOptions"
        [(value)]="settings.autoImportInterval"
        (valueChange)="onIntervalChange()">
      </app-custom-select>
    </div>
  </div>

  <!-- Linha -->
  <div class="line"></div>

  <!-- Importar ao Iniciar -->
  <div class="setting-item">
    <div class="setting-header">
      <span class="setting-label">Importar ao Iniciar</span>
      <app-toggle-switch
        [checked]="settings.importOnStartupEnabled"
        (checkedChange)="settings.importOnStartupEnabled = $event; onToggleChange()"
      ></app-toggle-switch>
    </div>
  </div>

  <!-- Linha -->
  <div class="line"></div>

  <!-- Alarme -->
  <div class="setting-item">
    <div class="setting-header">
      <div class="setting-label-group">
        <span class="setting-label">Alarme</span>
        <span class="dev-badge">Em desenvolvimento</span>
      </div>
      <app-toggle-switch
        [checked]="settings.alarmEnabled"
        (checkedChange)="settings.alarmEnabled = $event; onToggleChange()"
      ></app-toggle-switch>
    </div>
  </div>

  <!-- Linha -->
  <div class="line"></div>

  <!-- Notificação -->
  <div class="setting-item">
    <div class="setting-header">
      <div class="setting-label-group">
        <span class="setting-label">Notificação</span>
        <span class="dev-badge">Em desenvolvimento</span>
      </div>
      <app-toggle-switch
        [checked]="settings.notificationEnabled"
        (checkedChange)="settings.notificationEnabled = $event; onToggleChange()"
      ></app-toggle-switch>
    </div>
  </div>

  <!-- Linha -->
  <div class="line"></div>

  <!-- Inicialização Automática de Aplicativo Externo -->
  <div class="setting-item">
    <div class="setting-header">
      <span class="setting-label">Inicialização automática de aplicativo externo</span>
      <app-toggle-switch
        [checked]="settings.externalAppAutostartEnabled"
        (checkedChange)="settings.externalAppAutostartEnabled = $event; onToggleChange()"
      ></app-toggle-switch>
    </div>
    <span class="setting-description" *ngIf="settings.externalAppAutostartEnabled">
      Inicia automaticamente o aplicativo configurado ao detectar o início do expediente
    </span>
    <button
      type="button"
      class="app-picker-button"
      *ngIf="settings.externalAppAutostartEnabled"
      [disabled]="isPickingApp"
      [title]="settings.externalApp?.path || ''"
      (click)="onPickExternalApp()">
      <span class="app-picker-label">
        {{ settings.externalApp?.name || 'Selecionar Aplicativo' }}
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
        xmlns="http://www.w3.org/2000/svg">
        <path d="M15 3h6v6"></path>
        <path d="M10 14 21 3"></path>
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
      </svg>
    </button>
  </div>
</div>
