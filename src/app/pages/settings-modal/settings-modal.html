<div class="modal-overlay" *ngIf="isOpen" (click)="onOverlayClick($event)">
  <div class="modal-container" #modalContainer tabindex="-1">
    <div class="modal-header">
      <h2 class="modal-title">Configurações</h2>
      <button class="close-button" (click)="onClose()">
        <span class="icon-close"></span>
      </button>
    </div>

    <app-tabs
      [tabs]="tabLabels"
      [(activeIndex)]="activeTabIndex">

      <div class="modal-body">
        <!-- Aba 1: Geral -->
        <app-general-settings
          *ngIf="activeTabIndex === 0 && settingsLoaded"
          [settings]="settings"
          [intervalOptions]="intervalOptions"
          (settingsChange)="saveSettings()">
        </app-general-settings>

        <!-- Aba 2: Conta -->
        <app-integration-settings
          *ngIf="activeTabIndex === 1"
          [settings]="integrationSettings"
          [isLoggingIn]="isLoggingIn"
          [autoSyncEnabled]="settings.autoImportEnabled"
          [autoSyncIntervalMins]="settings.autoImportInterval"
          [importOnStartupEnabled]="settings.importOnStartupEnabled"
          (saveCredentials)="onSaveCredentials()"
          (logout)="onLogout()">
        </app-integration-settings>

        <!-- Aba 3: Sobre -->
        <app-about-settings
          *ngIf="activeTabIndex === 2"
          [appInfo]="appInfo">
        </app-about-settings>
      </div>
    </app-tabs>
  </div>
</div>
