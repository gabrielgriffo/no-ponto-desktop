<div class="tab-content">
  <div class="settings-card account-section">
    <!-- Cabeçalho: identifica a integração e o estado da conexão -->
    <header class="integration-header">
      <h3 class="section-title">Ponto Mais</h3>

      <span class="status-chip" [class.is-online]="isLoggedIn()">
        {{ isLoggedIn() ? 'Conectado' : 'Desconectado' }}
      </span>
    </header>

    @if (isLoggedIn()) {
      <!-- Estado conectado: a conta vinculada é o conteúdo, não há formulário -->
      <div class="account-row">
        <section class="account-card">
          <p class="account-email"
          tooltipPosition="top"
          [appTooltip]="account() || 'Conta vinculada'"
          >{{ account() || 'Conta vinculada' }}</p>
        </section>

        <button class="btn-ghost btn-ghost-danger disconnect-button" [disabled]="isLoggingOut()" (click)="logout.emit()">
          Desconectar
        </button>
      </div>

    } @else {
      <div class="field">
        <label class="field-label" for="pm-login">Login ou e-mail</label>
        <div class="field-control">
          <input
            id="pm-login"
            #loginInput
            type="text"
            class="field-input"
            spellcheck="false"
            autocorrect="off"
            autocapitalize="off"
            autocomplete="off"
            [value]="login()"
            (input)="login.set($any($event.target).value)"
            (keyup.enter)="onSaveCredentials()"
          />
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="pm-password">Senha</label>
        <div class="field-control">
          <input
            id="pm-password"
            [type]="showPassword() ? 'text' : 'password'"
            class="field-input has-affix"
            autocomplete="new-password"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            (keyup.enter)="onSaveCredentials()"
          />
          <button
            type="button"
            class="field-affix"
            [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'"
            (mousedown)="$event.preventDefault()"
            (click)="togglePasswordVisibility()"
            tabindex="-1"
          >
            @if (showPassword()) {
              <span class="i icon-eye"></span>
            } @else {
              <span class="i icon-eye-off"></span>
            }
          </button>
        </div>
      </div>
    }
  </div>

  @if (!isLoggedIn()) {
    <div class="setting-item">
      <div class="setting-header">
        <span class="setting-label">Reconexão automática</span>
        <app-toggle-switch
          [checked]="autoReconnect()"
          (checkedChange)="autoReconnectChange.emit($event)"
        />
      </div>
      <span class="setting-description">
        Reconecta a conta automaticamente quando a sessão expira
      </span>
    </div>

    <div class="action-row">
      <button class="btn-primary connect-button" (click)="onSaveCredentials()" [disabled]="!canSubmit()">
        @if (isLoggingIn()) {
          <span class="spinner"></span>
          Conectando...
        } @else {
          Conectar conta
        }
      </button>
    </div>
  }
</div>
