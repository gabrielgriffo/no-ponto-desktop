<div class="tab-content">
  <!-- Cabeçalho: identifica a integração e o estado da conexão -->
  <header class="integration-header">
    <h3 class="section-title">Ponto Mais</h3>

    <!-- <span class="status-chip" [class.is-online]="settings.isLoggedIn">
      <span class="status-dot"></span> -->
    <span class="status-chip" [class.is-online]="settings.isLoggedIn">
      {{ settings.isLoggedIn ? 'Conectado' : 'Desconectado' }}
    </span>
  </header>

  @if (settings.isLoggedIn) {
    <!-- Estado conectado: a conta vinculada é o conteúdo, não há formulário -->
    <div class="account-row">
      <section class="account-card">
        <p class="account-email"
        tooltipPosition="top"
        appTooltip="{{ settings.pontomaisLogin || 'Conta vinculada' }}"
        >{{ settings.pontomaisLogin || 'Conta vinculada' }}</p>
      </section>

      <button class="btn-ghost btn-ghost-danger disconnect-button" (click)="onLogout()">
        Desconectar
      </button>
    </div>

  } @else {
    <div class="field">
      <label class="field-label" for="pm-login">Login ou e-mail</label>
      <div class="field-control">
        <input
          id="pm-login"
          #loginInput
          type="text"
          class="field-input"
          spellcheck="false"
          autocorrect="off"
          autocapitalize="off"
          autocomplete="off"
          [(ngModel)]="settings.pontomaisLogin"
          (keyup.enter)="onSaveCredentials()"
        />
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="pm-password">Senha</label>
      <div class="field-control">
        <input
          id="pm-password"
          [type]="showPassword ? 'text' : 'password'"
          class="field-input has-affix"
          autocomplete="new-password"
          [(ngModel)]="settings.pontomaisPassword"
          (keyup.enter)="onSaveCredentials()"
        />
        <button
          type="button"
          class="field-affix"
          [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'"
          (mousedown)="$event.preventDefault()"
          (click)="togglePasswordVisibility()"
          tabindex="-1"
        >
          @if (showPassword) {
            <span class="i icon-eye"></span>
          } @else {
            <span class="i icon-eye-off"></span>
          }
        </button>
      </div>
    </div>

    <div class="setting-item">
      <div class="setting-header">
        <span class="setting-label">Reconexão Automática</span>
        <app-toggle-switch
          [checked]="autoReconnect"
          (checkedChange)="onAutoReconnectChange($event)"
        ></app-toggle-switch>
      </div>
      <span class="setting-description">
        Reconecta a conta quando a sessão expirar
      </span>
    </div>

    <div class="action-row">
      <button class="btn-primary connect-button" (click)="onSaveCredentials()" [disabled]="!canSubmit">
        @if (isLoggingIn) {
          <span class="spinner"></span>
          Conectando...
        } @else {
          Conectar conta
        }
      </button>
    </div>
  }
</div>
